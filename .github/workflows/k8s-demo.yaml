# condition to trigger the pipeline 
# DEVOPS-G12
on: 
  push: 
    branches: ["NON-EXISTENCE"]
env: 
  IMAGE_NAME: reactjs-g12-k8s
  HELM_REPO: keoKAY/demo-argocd-gitops-g12
jobs:
  build-and-push:
    runs-on: ubuntu-latest 
    environment: K8S_ENV
    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v3
        with:   
          fetch-depth: 0 # Shallow clone should be disable for the better relevancy of analysis     
      - name: Use with SHA 
        run: | 
          echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
      - name: Show the TAGS values
        run: |
          echo "TAG value is : ${{ env.TAG }}"
      - name: Login to Docker Registry 
        run: |
          echo "${{ secrets.PASSWORD }}" | docker login -u ${{ secrets.USERNAME }} --password-stdin
      - name: Build Docker Image
        run: docker build -t ${{ secrets.USERNAME }}/${{env.IMAGE_NAME }}:${{ env.TAG }} -f prod.Dockerfile  .

      - name: Push the Docker image 
        if: success()
        run: |
          docker push ${{ secrets.USERNAME }}/${{env.IMAGE_NAME }}:${{ env.TAG }}
      - name: Logout from the Registry
        if: always()
        run: |
          docker logout 
  
  deploy: 
    runs-on: ubuntu-latest 
    environment: K8S_ENV
    needs: build-and-push 
    steps: 
    # - name: Install yq command 
    #   run: |
    #     wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
    #     chmod +x /usr/local/bin/yq
    - name: Add Commit SHA to TAG env 
      run: |
        echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
    
    # clone the helm repo remporarily 
    - name: Clone ArgoCD repo 
      run: | 
        git clone https://github.com/${{ env.HELM_REPO }} helm_repo 
    - name: Update Helm Chart 
      run: |
        cd helm_repo/demo-chart

        echo "Update repository username/imagename "

        yq -i ".image.repository=\"${{ secrets.USERNAME }}/${{ env.IMAGE_NAME}}\"" values.yaml

        echo "Update image tag "
        yq -i ".image.tag=\"${{ env.TAG }}\"" values.yaml

        git config --global user.email "username@example.com"
        git config --global user.name "dummyname"
        git add . 
        git commit -m "Update helm to use image : ${{ env.TAG }}"
        
        git push https://${{ secrets.GIT_TOKEN }}@github.com/${{ env.HELM_REPO }}
    
    - name: Clean up 
      run: | 
        rm -rf helm_repo
